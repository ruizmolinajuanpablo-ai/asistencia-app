name: Compilar app iOS y Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Compilar iOS (IPA)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Dependencias
        working-directory: asistencia_app
        run: flutter pub get

      - name: Análisis de código
        working-directory: asistencia_app
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        working-directory: asistencia_app
        run: flutter test

      - name: Compilar IPA (sin firmar)
        working-directory: asistencia_app
        run: flutter build ipa --release --no-codesign

      - name: Empaquetar .ipa instalable
        run: |
          APP=$(find asistencia_app/build/ios/archive -name Runner.app -type d | head -1)
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/asistencia-app.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/asistencia-app.ipa"

      - name: Subir .ipa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa
          path: asistencia-app.ipa
          retention-days: 30

  build-web:
    name: Compilar app web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Dependencias
        working-directory: asistencia_app
        run: flutter pub get

      - name: Compilar web
        working-directory: asistencia_app
        run: flutter build web --release --base-href /app/

      - name: Subir app web como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: asistencia_app/build/web/
          retention-days: 30

  release:
    name: Publicar .ipa en Releases
    needs: build-ios
    runs-on: ubuntu-latest
    steps:
      - name: Descargar .ipa compilado
        uses: actions/download-artifact@v4
        with:
          name: app-ios-ipa

      - name: Crear o actualizar release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest asistencia-app.ipa --clobber
          else
            gh release create latest asistencia-app.ipa \
              --title "Última versión de la app" \
              --notes "Compilación automática desde main. Descarga asistencia-app.ipa e instálala con AltStore o Sideloadly."
          fi
          echo "Release disponible en https://github.com/${GITHUB_REPOSITORY}/releases/latest"
